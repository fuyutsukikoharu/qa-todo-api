services:
  api:
    build: .
    ports:
      - "8000:8000"
    # 加上健康检查，让 tests 知道 api 什么时候真正可用
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')" ]
      interval: 5s
      timeout: 3s
      retries: 5

  tests:
    build: .
    environment:
      - BASE_URL=http://api:8000
      - API_TOKEN=test-token
    depends_on:
      api:
        condition: service_healthy  # 等 api 健康检查通过后再启动
    # 重点！必须指定执行 pytest
    command: pytest --alluredir=./allure-results
    # 挂载目录，把容器里的报告结果拷到外面，容器销毁了报告还在
    volumes:
      - ./allure-results:/app/allure-results