name: API Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 关键补漏：启动 FastAPI 后端
      - name: Start API
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &

      # 关键补漏：循环等待后端彻底启动完成
      - name: Wait for API
        run: |
          for i in {1..15}; do
            curl -s http://localhost:8000/docs && break
            sleep 1
          done

      - name: Run tests
        run: |
          pytest --alluredir=./allure-results
        continue-on-error: true

      - name: Install Allure Commandline
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre
          ALLURE_VERSION=2.29.0
          curl -o allure.zip -L https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.zip
          sudo unzip allure.zip -d /opt/
          sudo ln -s /opt/allure-${ALLURE_VERSION}/bin/allure /usr/bin/allure

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report